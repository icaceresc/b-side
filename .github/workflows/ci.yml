name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The native helper, compiled from native/helper with the pinned Rust (rust-toolchain.toml).
  # The repository carries no binary: releases attach these builds, and B-Side downloads the one
  # for the PC and runs it only with the SHA-256 pinned in src/native-helper.mjs.
  native:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Rust toolchain
        working-directory: native/helper
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - name: Unit tests
        working-directory: native/helper
        run: cargo test --release --locked --target x86_64-pc-windows-msvc

      - name: Build x64 and arm64
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}\cargo-target
        run: |
          node native/build.mjs x64 arm64
          Get-Content native/bin/SHA256SUMS

      # A release tag needs builds that are byte for byte the pinned ones; any other commit is told.
      - name: Pinned SHA-256
        run: |
          if ('${{ github.ref }}'.StartsWith('refs/tags/v')) { node native/pins.mjs native/bin } else { node native/pins.mjs native/bin --warn }

      - uses: actions/upload-artifact@v7
        with:
          name: native-helper
          path: |
            native/bin/bside-helper-*.exe
            native/bin/SHA256SUMS
          if-no-files-found: error

  # Unit tests, and every integration test against the native helper just built (and the
  # PowerShell one); AIMP is not installed on the runner. arm64 runs the arm64 build.
  test:
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
          - arch: arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: native-helper
          path: ${{ runner.temp }}/fresh

      # Apart from the helper tests, whose PowerShell starts and C# compiles would steal the CPU
      # from the timing tests (search under 50 ms).
      - name: Unit tests
        run: |
          $unit = Get-ChildItem test/*.test.mjs | Where-Object Name -NotMatch 'helper' | ForEach-Object FullName
          node --test @unit

      - name: Helper integration tests
        env:
          BSIDE_NATIVE_HELPER: ${{ runner.temp }}\fresh\bside-helper-${{ matrix.arch }}.exe
          BSIDE_REQUIRE_NATIVE: '1'
        run: node --test "test/*helper*.test.mjs"

  # On a push, once every test passed on them, each build gets a build provenance attestation:
  # what native/verify.mjs and `gh attestation verify` check a downloaded helper (or a release's
  # files) against. The only job that can sign.
  attest:
    if: github.event_name == 'push'
    needs: [native, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: native-helper
          path: fresh

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: fresh/bside-helper-*.exe

  lint:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      # Orca's Community catalog lists no repository with binary files in its tree.
      - name: No binaries in the tree
        run: |
          $bin = git ls-files | Where-Object { $_ -match '\.(exe|dll|sys|node|so|dylib|msi|zip|7z|rar|tgz|gz|jar)$' }
          if ($bin) { $bin; throw 'binary files in the repository' }
          'no binaries tracked'

      # Windows PowerShell 5.1 is what runs the fallback helper and the installer.
      - name: PowerShell parse check
        shell: powershell
        run: |
          $bad = 0
          # -Filter *.ps1 also matches .ps1xml on Windows, so compare the extension exactly.
          Get-ChildItem -Recurse -File | Where-Object Extension -eq .ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) { Write-Output "$($_.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }

      - name: PSScriptAnalyzer
        run: |
          Install-Module PSScriptAnalyzer -Repository PSGallery -Scope CurrentUser -Force
          $found = 'install.ps1', 'native/aimp-helper.ps1' | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Error, Warning }
          $found | Format-Table ScriptName, Line, Severity, RuleName, Message -AutoSize -Wrap
          if ($found) { exit 1 }

      - name: Rust format and lints
        working-directory: native/helper
        run: |
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --release --locked --target x86_64-pc-windows-msvc -- -D warnings

      - name: Manifest
        run: |
          $m = Get-Content orca-plugin.json -Raw | ConvertFrom-Json
          $missing = @('manifestVersion', 'id', 'name', 'version', 'execution' | Where-Object { -not $m.$_ })
          if (-not $m.engines.orca) { $missing += 'engines.orca' }
          if ($missing) { throw "orca-plugin.json is missing: $($missing -join ', ')" }
          "$($m.id) $($m.version), orca $($m.engines.orca)"
