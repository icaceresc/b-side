<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>B-Side</title>
<style>
/* Orca injects its theme as --orca-* variables; B-Side keeps its own accent, tinted by the cover. */
:root {
  --bg: var(--orca-background, #111114);
  --fg: var(--orca-foreground, #ececf1);
  --muted: var(--orca-muted-foreground, #8d8d99);
  --card: var(--orca-card, #1a1a20);
  --line: var(--orca-border, rgba(255, 255, 255, 0.08));
  --hover: var(--orca-accent, rgba(255, 255, 255, 0.06));
  --ring: var(--orca-ring, #ff6a3d);
  --danger: var(--orca-destructive, #ef4f5a);
  --accent: #ff6a3d;
  --accent-soft: rgba(255, 106, 61, 0.16);
  --font: var(--orca-font-sans, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif);
  color-scheme: dark;
}
html.light { color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; opacity: 0.35; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 6px; }
svg { width: 18px; height: 18px; fill: currentColor; flex: none; display: block; }

.app { position: relative; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.backdrop { position: absolute; inset: -80px; background-size: cover; background-position: center; filter: blur(70px) saturate(1.6); opacity: 0; transition: opacity 0.7s; pointer-events: none; }
.backdrop.on { opacity: 0.4; }
html.light .backdrop.on { opacity: 0.25; }
.shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, transparent 0%, color-mix(in srgb, var(--bg) 65%, transparent) 50%, var(--bg) 92%); }
.app > *:not(.backdrop):not(.shade) { position: relative; }

.top { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; flex: none; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 800; letter-spacing: 0.18em; font-size: 11px; flex: none; white-space: nowrap; }
.vinyl { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle, var(--accent) 0 3px, #111 3.5px 5px, #2a2a2e 5.5px 6px, #111 6.5px 8px, #2a2a2e 8.5px 9px, #111 9.5px); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 0 16px var(--accent-soft); }
.vinyl.spin { animation: spin 2.4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.brand b { color: var(--accent); }
.right { position: relative; display: flex; align-items: center; justify-content: flex-end; gap: 8px; min-width: 0; flex: 1 1 auto; margin-left: 10px; }
.lang { width: 30px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--hover); flex: none; }
.lang:hover { background: color-mix(in srgb, var(--fg) 14%, transparent); }
.lang img, .langmenu img { border-radius: 2px; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12); display: block; }
.langmenu { position: absolute; top: calc(100% + 8px); right: 0; z-index: 6; min-width: 168px; padding: 6px; border-radius: 12px; background: var(--orca-popover, #1f1f26); color: var(--orca-popover-foreground, var(--fg)); border: 1px solid var(--line); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45); display: flex; flex-direction: column; }
.langmenu button { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; text-align: left; font-size: 13px; }
.langmenu button:hover, .langmenu button:focus-visible { background: var(--hover); }
.langmenu button[aria-checked='true'] { font-weight: 700; color: var(--accent); }
.pill { white-space: nowrap; min-width: 0; }
.pill span { overflow: hidden; text-overflow: ellipsis; }
.pill { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); padding: 4px 10px; border-radius: 999px; background: var(--hover); }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.pill.ok i { background: #3ddc84; box-shadow: 0 0 8px rgba(61, 220, 132, 0.6); }
.pill.bad i { background: var(--danger); }

.banner { margin: 6px 16px 0; padding: 9px 12px; border-radius: 10px; display: flex; gap: 10px; align-items: center; font-size: 12px; background: rgba(255, 184, 77, 0.1); border: 1px solid rgba(255, 184, 77, 0.35); }
.banner svg { width: 16px; height: 16px; color: #ffb84d; }
.banner b { display: block; font-weight: 600; }
.banner span { color: var(--muted); }

.body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: safe center; padding: 14px 22px 24px; scrollbar-width: thin; }
/* The cover gives way first, so the controls fit without scrolling in a short sidebar. */
.cover { position: relative; width: min(100%, 340px, max(110px, 100vh - 395px)); aspect-ratio: 1; border-radius: 14px; overflow: hidden; flex: none; background: linear-gradient(135deg, #2a2a33, #16161b); box-shadow: 0 28px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05); display: grid; place-items: center; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.4s; }
.cover img.in { opacity: 1; }
.disc { width: 46%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle closest-side, var(--accent) 0 18%, #0d0d10 19% 28%, #1d1d22 29% 32%, #0d0d10 33% 60%, #1d1d22 61% 63%, #0d0d10 64% 92%, #1d1d22 93% 96%, #0d0d10 97%); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
.disc.spin { animation: spin 3.2s linear infinite; }

.meta { width: min(100%, 340px); margin-top: 20px; }
.title { font-size: 21px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.2; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.sub { color: var(--muted); margin-top: 3px; font-size: 13px; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; min-height: 20px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 5px; background: var(--hover); color: var(--muted); text-transform: uppercase; }
.chip.hq { background: var(--accent-soft); color: var(--accent); }
.chip svg { width: 11px; height: 11px; }

.prog { width: min(100%, 340px); margin-top: 16px; }
.track { position: relative; height: 18px; cursor: pointer; display: flex; align-items: center; touch-action: none; }
.track::before { content: ''; position: absolute; left: 0; right: 0; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--fg) 16%, transparent); }
.fill { position: absolute; left: 0; height: 4px; border-radius: 2px; background: var(--fg); width: 0; }
.knob { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--fg); left: 0; transform: translateX(-50%) scale(0); transition: transform 0.12s; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4); }
.track:hover .knob, .prog.drag .knob, .track:focus-visible .knob { transform: translateX(-50%) scale(1); }
.track:hover .fill, .prog.drag .fill { background: var(--accent); }
.prog.off .track { cursor: default; }
.times { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; margin-top: 2px; }

.transport { display: flex; align-items: center; justify-content: space-between; width: min(100%, 300px); margin-top: 8px; }
.ib { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; transition: background 0.15s, transform 0.1s; }
.ib:hover:not(:disabled) { background: var(--hover); }
.ib:active:not(:disabled) { transform: scale(0.92); }
.ib svg { width: 22px; height: 22px; }
.ib.side svg { width: 18px; height: 18px; color: var(--muted); }
.ib.side.on svg { color: var(--accent); }
.ib.hero { width: 62px; height: 62px; background: var(--fg); color: var(--bg); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); }
.ib.hero svg { width: 28px; height: 28px; }
.ib.hero:hover:not(:disabled) { background: var(--fg); transform: scale(1.04); }

.vol { display: flex; align-items: center; gap: 10px; width: min(100%, 280px); margin-top: 16px; color: var(--muted); }
.vol svg { width: 16px; height: 16px; }
.vol .ib { width: 28px; height: 28px; margin: 0 -4px; }
.vol .ib svg { width: 16px; height: 16px; }
.vol.muted input[type='range'] { background: linear-gradient(90deg, color-mix(in srgb, var(--fg) 38%, transparent) var(--v, 50%), color-mix(in srgb, var(--fg) 16%, transparent) var(--v, 50%)); }
.vol output { width: 28px; text-align: right; font-size: 11px; font-variant-numeric: tabular-nums; }
input[type='range'] { -webkit-appearance: none; appearance: none; flex: 1; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--fg) var(--v, 50%), color-mix(in srgb, var(--fg) 16%, transparent) var(--v, 50%)); outline: none; cursor: pointer; }
input[type='range']:disabled { opacity: 0.35; cursor: default; }
input[type='range']::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--fg); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4); }

.hint { margin-top: 18px; font-size: 11px; color: var(--muted); text-align: center; max-width: 300px; }
.hint b { color: var(--fg); font-weight: 600; }

.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 26px; gap: 6px; }
.empty .disc { width: 120px; margin-bottom: 14px; }
.empty h2 { margin: 0; font-size: 17px; font-weight: 800; }
.empty p { margin: 0 0 14px; color: var(--muted); max-width: 290px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 12px; background: var(--accent); color: #fff; transition: transform 0.1s, filter 0.15s; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: scale(0.97); }
.btn svg { width: 15px; height: 15px; }

.skel { background: linear-gradient(90deg, var(--card) 0%, var(--hover) 50%, var(--card) 100%); background-size: 200% 100%; animation: sk 1.3s infinite linear; border-radius: 8px; }
@keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }

.toast { position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 16px); background: var(--orca-popover, #24242c); color: var(--orca-popover-foreground, var(--fg)); border: 1px solid var(--line); padding: 10px 14px; border-radius: 10px; font-size: 12px; max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); opacity: 0; pointer-events: none; transition: all 0.22s; z-index: 5; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { border-color: color-mix(in srgb, var(--danger) 50%, transparent); }
/* Lyrics and artist picture. The stage keeps the cover's size, so the lyrics view takes its place
   without moving anything else; it scrolls on its own. */
.stage { position: relative; width: min(100%, 340px, max(110px, 100vh - 395px)); aspect-ratio: 1; flex: none; }
.artistfill { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 0.4s; }
.artistfill.in { opacity: 1; }
.lyrics { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; border-radius: 14px; padding: 16px 14px 44px; background: color-mix(in srgb, var(--card) 80%, transparent); box-shadow: 0 0 0 1px var(--line); font-size: 13px; line-height: 1.45; scrollbar-width: thin; -webkit-mask-image: linear-gradient(transparent, #000 8%, #000 88%, transparent); mask-image: linear-gradient(transparent, #000 8%, #000 88%, transparent); }
.lyrics p { margin: 0 0 4px; color: var(--fg); overflow-wrap: anywhere; }
.lyrics p.gap { height: 10px; margin: 0; }
.lyrics.synced { padding: 33% 14px 62%; }
.lyrics.synced p { margin-bottom: 7px; font-size: 14px; font-weight: 700; color: var(--muted); opacity: 0.75; cursor: pointer; transition: color 0.25s, opacity 0.25s; }
.lyrics.synced p.past { opacity: 0.45; }
.lyrics.synced p.now { color: var(--fg); opacity: 1; }
.lyrics.synced p:hover { color: var(--fg); }
.lyrbtn { position: absolute; right: 8px; bottom: 8px; z-index: 2; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); background: color-mix(in srgb, var(--card) 80%, transparent); box-shadow: 0 0 0 1px var(--line); transition: color 0.15s; }
.lyrbtn svg { width: 16px; height: 16px; }
.lyrbtn:hover { color: var(--fg); background: color-mix(in srgb, var(--card) 80%, var(--hover)); }
.lyrbtn[aria-pressed='true'] { color: var(--accent); background: color-mix(in srgb, var(--card) 70%, var(--accent-soft)); }
.lyrbtn.dim { opacity: 0.55; cursor: help; }
.subrow { display: flex; align-items: flex-start; gap: 7px; margin-top: 3px; }
.subrow .sub { margin-top: 0; flex: 1; min-width: 0; }
.avatar { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; flex: none; box-shadow: 0 0 0 1px var(--line); }
@media (prefers-reduced-motion: reduce) { .lyrics.synced p, .artistfill, .lyrbtn { transition: none; } }
/* Narrow sidebars: the logo stays, the wordmark gives its room to the status (Orca's tab says B-Side). */
@media (max-width: 300px) { .brand .word { display: none; } }
/* Short sidebars: tighter rhythm, same layout. */
@media (max-height: 720px) {
  .body { padding: 8px 18px 14px; }
  .meta { margin-top: 14px; }
  .title { font-size: 18px; }
  .chips { margin-top: 8px; }
  .prog { margin-top: 10px; }
  .transport { margin-top: 4px; }
  .ib.hero { width: 54px; height: 54px; }
  .ib.hero svg { width: 24px; height: 24px; }
  .vol { margin-top: 10px; }
}
[hidden] { display: none !important; }
</style>
</head>

<div class="app">
  <div class="backdrop" id="backdrop"></div>
  <div class="shade"></div>
  <header class="top">
    <div class="brand"><span class="vinyl" id="logo" aria-hidden="true"></span><span class="word">B<b>-SIDE</b></span></div>
    <div class="right">
      <div class="pill" id="pill" role="status"><i></i><span data-i18n="connecting">Connecting…</span></div>
      <button class="lang" id="langBtn" aria-haspopup="menu" aria-expanded="false"><img id="langFlag" src="flags/gb.svg" alt="" width="20" height="15"></button>
      <div class="langmenu" id="langMenu" role="menu" hidden></div>
    </div>
  </header>
  <div class="banner" id="offline" hidden>
    <svg><use href="#i-wifi"/></svg>
    <div><b data-i18n="offline">Offline</b><span data-i18n="offlineHint">Streaming from the cloud needs internet.</span></div>
  </div>

  <section class="empty" id="loading">
    <div class="skel" style="width:min(70vw,300px);aspect-ratio:1;border-radius:14px"></div>
    <div class="skel" style="width:180px;height:14px;margin-top:18px"></div>
    <div class="skel" style="width:120px;height:11px;margin-top:8px"></div>
  </section>

  <section class="empty" id="closed" hidden>
    <div class="disc" aria-hidden="true"></div>
    <h2 data-i18n="closedTitle">AIMP is closed</h2>
    <p data-i18n="closedText">Open it to play your collection. B-Side controls it from here.</p>
    <button class="btn" id="openAimp"><svg><use href="#i-open"/></svg><span data-i18n="openAimp">Open AIMP</span></button>
  </section>

  <section class="body" id="player" hidden>
    <div class="stage">
      <div class="cover" id="cover"><div class="disc" id="disc" aria-hidden="true"></div><div class="artistfill" id="artistFill" aria-hidden="true"></div></div>
      <div class="lyrics" id="lyrics" role="region" data-i18n-label="lyrics" aria-label="Lyrics" tabindex="0" hidden></div>
      <button class="lyrbtn" id="lyricsBtn" data-i18n-label="lyrics" aria-label="Lyrics" aria-pressed="false" hidden><svg aria-hidden="true"><use href="#i-lyrics"/></svg></button>
    </div>
    <div class="meta">
      <div class="title" id="title" data-i18n="nothing">Nothing playing</div>
      <div class="subrow"><img class="avatar" id="avatar" alt="" hidden><div class="sub" id="sub"></div></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="prog" id="prog">
      <div class="track" id="seek" role="slider" data-i18n-label="position" aria-label="Position" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
      <div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>
    </div>
    <div class="transport">
      <button class="ib side" id="shuffle" data-i18n-label="shuffle" aria-label="Shuffle" aria-pressed="false"><svg><use href="#i-shuffle"/></svg></button>
      <button class="ib" id="prev" data-i18n-label="previous" aria-label="Previous"><svg><use href="#i-prev"/></svg></button>
      <button class="ib hero" id="play" aria-label="Play"><svg><use href="#i-play"/></svg></button>
      <button class="ib" id="next" data-i18n-label="next" aria-label="Next"><svg><use href="#i-next"/></svg></button>

const pickLang = (tag) => {

function applyLanguage() {

  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n)
  for (const el of document.querySelectorAll('[data-i18n-html]')) el.innerHTML = t(el.dataset.i18nHtml)
  for (const el of document.querySelectorAll('[data-i18n-label]')) el.setAttribute('aria-label', t(el.dataset.i18nLabel))

  $('langBtn').title = t('language')

    if (S.p) paint() // S does not exist yet on the first call
  } catch {}
}
async function setLanguage(code) {
  if (!STRINGS[code]) return
  LANG = code
  applyLanguage()
  try {
    await orca.storage.set('language', code)
  } catch {

  }
}

function toast(text, bad = false, detail = '') {

  el.textContent = text
  el.title = detail // the raw message, for diagnosis; the worker also logs it

// The worker returns B-Side's own errors as { error: { code, message } } (Orca only carries its
// own codes); turn them back into errors with a code.
async function ask(name, input = {}, options) {
  const r = await orca.plugin.request(name, input, options)
  if (r && r.error && r.error.code) throw Object.assign(new Error(r.error.message), { code: r.error.code })
  return r
}
// Always a message in the person's language; unknown codes get the generic one.
const fail = (e) => toast((e && MESSAGES[e.code]) || t('failed'), true, (e && e.message) || '')

const S = { p: null, at: 0, seeking: false, artKey: undefined, polling: false, failures: 0, volBusy: false, lastVol: null }

function show(view) {
  for (const id of ['loading', 'closed', 'player']) $(id).hidden = id !== view
}

async function poll() {
  if (document.hidden || S.polling) return
  S.polling = true
  try {
    const p = await ask('player.state', {}, { timeoutMs: 25000 })
    S.failures = 0
    S.p = p
    S.at = performance.now()
    paint()
  } catch (e) {
    // A slow or restarting AIMP keeps the last picture; only the status pill says so.
    S.failures++
    if (!S.p || S.failures >= 5) {
      S.p = { running: false, error: e }
      paint()
    } else pill(e)
  } finally {
    S.polling = false
  }
}

function pill(error) {
  const p = S.p
  $('pill').className = 'pill ' + (error ? 'bad' : p?.running ? 'ok' : 'bad')
  $('pill').querySelector('span').textContent = error ? (error.code === 'helper_failed' ? t('pillNoAccess') : t('pillSlow')) : p?.running ? t('pillOk') : t('pillClosed')
  $('pill').title = error?.message || ''
}

function paint() {
  const p = S.p
  const playing = p.running && p.state === 'playing'
  const song = p.running ? p.track : null

  pill(p.error)
  $('offline').hidden = p.online !== false
  $('logo').classList.toggle('spin', Boolean(playing))
  $('disc').classList.toggle('spin', Boolean(playing))
  extras(song)

  if (!p.running) {
    show('closed')
    S.artKey = undefined
    setArt(null)
    return
  }
  show('player')
  $('hint').hidden = Boolean(song)
  $('title').textContent = song ? (song.untitled ? t('untitled') : song.title) : t('nothing')
  $('title').title = $('title').textContent // the full title when two lines cut it short
  $('sub').textContent = song ? [song.artist, [song.album, song.year].filter(Boolean).join(' · ')].filter(Boolean).join(' — ') || t('unknownArtist') : t('waiting')
  $('sub').title = $('sub').textContent
  const q = song && song.quality
  const chips = []
  if (q) {
    if (q.cd) chips.push(`<span class="chip hq">${t('cd')}</span>`)
    else if (q.lossless) chips.push(`<span class="chip hq">${t('lossless')}</span>`)
    if (q.codec) chips.push(`<span class="chip">${esc(q.codec)}</span>`)
    if (q.sampleRateLabel) chips.push(`<span class="chip">${esc(q.sampleRateLabel)}</span>`)
    if (q.bitrate) chips.push(`<span class="chip">${esc(q.bitrate)} kbps</span>`)
    if (q.channels) chips.push(`<span class="chip">${q.channels === 2 ? t('stereo') : q.channels === 1 ? t('mono') : esc(q.channels) + ' ' + t('channels')}</span>`)
  }
  if (song && song.cloud) chips.push(`<span class="chip">${icon('cloud')}${t('cloud')}</span>`)
  const html = chips.join('')
  if ($('chips').innerHTML !== html) $('chips').innerHTML = html

  const playBtn = $('play')
  playBtn.innerHTML = icon(playing ? 'pause' : 'play')
  playBtn.setAttribute('aria-label', playing ? t('pause') : t('play'))
  for (const id of ['prev', 'next']) $(id).disabled = !song
  $('shuffle').classList.toggle('on', Boolean(p.shuffle))
  $('shuffle').setAttribute('aria-pressed', String(Boolean(p.shuffle)))
  $('repeat').classList.toggle('on', Boolean(p.repeat))
  $('repeat').setAttribute('aria-pressed', String(Boolean(p.repeat)))
  $('prog').classList.toggle('off', !song)
  // AIMP reports volume 0 while muted and restores it on unmute: keep showing the real level, dimmed.
  if (!p.mute && p.volume != null) S.lastVol = p.volume
  if (!S.volBusy) setVol(p.mute && !p.volume ? S.lastVol ?? 0 : p.volume ?? 0)
  paintMute()

  const key = song ? song.key : null
  if (key !== S.artKey) {
    S.artKey = key
    setArt(null)
    if (key) loadArt(key)
  }
}

// AIMP can get a cloud track's cover a moment after it starts: ask again a few times.
async function loadArt(key) {
  for (const wait of [0, 1500, 4000, 9000]) {
    if (wait) await new Promise((r) => setTimeout(r, wait))
    if (S.artKey !== key) return
    try {
      const r = await ask('player.art', { key }, { timeoutMs: 15000 })
      if (S.artKey !== key) return
      if (r.dataUrl) return setArt(r.dataUrl)
    } catch {
      /* the cover is optional */
    }
  }
}

function setArt(url) {
  const cover = $('cover')
  cover.querySelector('img')?.remove()
  $('disc').hidden = Boolean(url)
  const bd = $('backdrop')
  if (!url) {
    bd.classList.remove('on')
    setAccent(null)
    return
  }
  const img = new Image()
  img.alt = ''
  img.onload = () => img.classList.add('in')
  img.src = url
  cover.appendChild(img)
  bd.style.backgroundImage = `url("${url}")`
  bd.classList.add('on')
  tint(url)
}

// Accent colour from the cover's most vivid pixel, kept bright enough for text.
function tint(url) {
  const img = new Image()
  img.onload = () => {
    try {
      const c = document.createElement('canvas')
      c.width = c.height = 24
      const g = c.getContext('2d', { willReadFrequently: true })
      g.drawImage(img, 0, 0, 24, 24)
      const d = g.getImageData(0, 0, 24, 24).data
      let best = null
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], gg = d[i + 1], b = d[i + 2]
        const max = Math.max(r, gg, b), min = Math.min(r, gg, b)
        const sat = max ? (max - min) / max : 0
        const score = sat * 1.4 + max / 255
        if (!best || score > best.score) best = { r, g: gg, b, score, sat }
      }
      if (!best || best.sat < 0.2) return setAccent(null)
      setAccent(hue(best.r, best.g, best.b))
    } catch {
      setAccent(null)
    }
  }
  img.src = url
}
function hue(r, g, b) {
  r /= 255; g /= 255; b /= 255
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min
  let h = 0
  if (d) h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4
  return Math.round(((h * 60) + 360) % 360)
}
function setAccent(h) {
  const st = document.documentElement.style
  if (h === null) {
    st.removeProperty('--accent')
    st.removeProperty('--accent-soft')
  } else {
    st.setProperty('--accent', `hsl(${h} 78% 62%)`)
    st.setProperty('--accent-soft', `hsl(${h} 78% 62% / 0.16)`)
  }
}

// Muted shows the mute icon and a dimmed slider; the button's label stays "Mute" and aria-pressed

function paintMute() {
  const p = S.p
  const muted = Boolean(p.mute)
  $('volIcon').innerHTML = `<use href="#i-${muted || !Number($('vol').value) ? 'mute' : 'vol'}"/>`
  $('volBox').classList.toggle('muted', muted)
  $('mute').setAttribute('aria-pressed', String(muted))
  $('mute').title = t(muted ? 'unmute' : 'mute')
}

function setVol(v) {
  $('vol').value = v
  $('vol').style.setProperty('--v', v + '%')
  $('volOut').textContent = v
}

// Lyrics and the artist's picture, for files on this PC only: AIMP shares neither, so the worker
// reads them next to the file AIMP is playing (tags, a .lrc beside it, artist.jpg one folder up).
// The toggle is remembered for the session; it appears only when the track has lyrics, and as a

// The artist picture becomes the cover when AIMP has none (after a moment, so AIMP's own cover

      }, 1500)
      loadExtra('player.lyrics', key, (r) => (L.data = r))
      loadExtra('player.artist', key, (r) => (L.artist = r.dataUrl || null))
    }
  }
  paintLyrics()
  paintArtist()
}
// Both are optional: a failure leaves the cover as it is, without a message.
async function loadExtra(name, key, keep) {
  try {
    const r = await ask(name, { key }, { timeoutMs: 15000 })
    if (L.key !== key || r.key !== key) return
    keep(r)
  } catch {
    return
  }
  paintLyrics()
  paintArtist()
}

function paintLyrics() {
  const d = L.data
  const has = Boolean(d && d.lines && d.lines.length)
  const cloud = Boolean(d && d.reason === 'cloud')
  const showing = has && L.on
  const btn = $('lyricsBtn')
  btn.hidden = !has && !cloud
  btn.classList.toggle('dim', cloud)
  btn.setAttribute('aria-disabled', String(cloud))
  btn.setAttribute('aria-pressed', String(showing))
  btn.title = cloud ? t('lyricsCloud') : t('lyrics')
  $('cover').hidden = showing
  const view = $('lyrics')
  view.hidden = !showing
  if (!showing || L.shown === d) return
  L.shown = d
  L.idx = -1
  view.className = 'lyrics' + (d.synced ? ' synced' : '')
  view.innerHTML = d.lines.map((l, i) => `<p data-i="${i}"${l.text ? '' : ' class="gap"'}${d.synced && l.ms != null ? ` data-ms="${l.ms}"` : ''}>${esc(l.text)}</p>`).join('')
  view.scrollTop = 0
  followLyrics()
}

// The current synced line, from the panel's own position estimate; it scrolls to about a third
// from the top unless the person scrolled the lyrics in the last few seconds.
function followLyrics() {
  const d = L.data
  const view = $('lyrics')
  if (view.hidden || !d || !d.synced || document.hidden) return
  const { pos } = position()
  let idx = -1
  for (let i = 0; i < d.lines.length; i++) {
    const ms = d.lines[i].ms
    if (ms == null) continue
    if (ms > pos + 150) break
    idx = i
  }
  if (idx === L.idx) return
  L.idx = idx
  for (const el of view.children) {
    const i = Number(el.dataset.i)
    el.classList.toggle('past', i < idx)
    el.classList.toggle('now', i === idx)
  }
  if (performance.now() - L.userScroll < 4000) return
  const el = view.children[idx]
  const top = el ? el.offsetTop + el.offsetHeight / 2 - view.clientHeight / 3 : 0
  view.scrollTo({ top: Math.max(0, top), behavior: reducedMotion.matches ? 'auto' : 'smooth' })
}
setInterval(followLyrics, 200)

function paintArtist() {
  const url = L.key ? L.artist : null
  const fill = $('artistFill')
  const asCover = Boolean(url && L.ready && !$('cover').querySelector('img'))
  if (asCover && fill.dataset.url !== url) {
    fill.style.backgroundImage = `url("${url}")`
    fill.dataset.url = url
  }
  fill.classList.toggle('in', asCover)
  const avatar = $('avatar')
  const withAvatar = Boolean(url && L.ready && !(asCover && !$('cover').hidden))
  if (withAvatar && avatar.getAttribute('src') !== url) avatar.src = url
  avatar.hidden = !withAvatar
}

$('lyricsBtn').onclick = () => {
  if (L.data && L.data.reason === 'cloud') return toast(t('lyricsCloud'))
  L.on = !L.on
  try {
    sessionStorage.setItem('bside.lyrics', L.on ? '1' : '0')
  } catch {}
  L.userScroll = -Infinity
  L.idx = -1
  paintLyrics()
  paintArtist()
  followLyrics()
}
for (const ev of ['wheel', 'touchmove', 'keydown']) $('lyrics').addEventListener(ev, () => (L.userScroll = performance.now()), { passive: true })
$('lyrics').addEventListener('click', (e) => {
  const el = e.target.closest('p[data-ms]')
  if (!el || !S.p?.running) return
  const ms = Number(el.dataset.ms)
  S.p.positionMs = ms
  S.at = performance.now()
  L.userScroll = -Infinity
  command('seek', { positionMs: ms })
  followLyrics()
})

function position() {
  const p = S.p
  if (!p?.running || !p.track) return { pos: 0, dur: 0 }
  let pos = p.positionMs ?? 0
  if (p.state === 'playing') pos += performance.now() - S.at
  const dur = p.durationMs || 0
  return { pos: dur ? Math.min(pos, dur) : pos, dur }
}
function tick() {
  if (!S.seeking) {
    const { pos, dur } = position()
    const pct = dur ? (pos / dur) * 100 : 0
    $('fill').style.width = pct + '%'
    $('knob').style.left = pct + '%'
    $('pos').textContent = fmt(pos)
    $('dur').textContent = fmt(dur)
    $('seek').setAttribute('aria-valuenow', String(Math.round(pct)))
    $('seek').setAttribute('aria-valuetext', `${fmt(pos)} ${t('of')} ${fmt(dur)}`)
  }
  requestAnimationFrame(tick)
}

async function command(cmd, args) {
  try {
    await ask('player.command', { command: cmd, args })
  } catch (e) {
    fail(e)
  }
  setTimeout(poll, 120)
  setTimeout(poll, 700)
}

$('play').onclick = () => command('playPause')
$('prev').onclick = () => command('previous')
$('next').onclick = () => command('next')
// Toggles flip at once, so a second quick click undoes the first instead of repeating it.
function toggle(name) {
  if (!S.p?.running) return
  const on = !S.p[name]
  S.p[name] = on
  paint()
  command(name, { on })
}
$('shuffle').onclick = () => toggle('shuffle')
$('repeat').onclick = () => toggle('repeat')
$('mute').onclick = () => toggle('mute')
$('langBtn').onclick = (e) => {
  e.stopPropagation()
  toggleLangMenu()
}
$('langMenu').addEventListener('click', (e) => {
  const b = e.target.closest('[data-lang]')
  if (!b) return
  setLanguage(b.dataset.lang)
  toggleLangMenu(false)
  $('langBtn').focus()
})
document.addEventListener('click', (e) => {
  if (!$('langMenu').hidden && !e.target.closest('#langMenu')) toggleLangMenu(false)
})
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('langMenu').hidden) toggleLangMenu(false)
})
$('openAimp').onclick = async () => {
  toast(t('opening'))
  try {
    await ask('aimp.open')
  } catch (e) {
    fail(e)
  }
  for (const ms of [1500, 3000, 5000, 8000]) setTimeout(poll, ms)
}

let volTimer = 0
let volRelease = 0
let volUnmute = false
$('vol').addEventListener('input', () => {
  const v = Number($('vol').value)
  S.volBusy = true
  setVol(v)
  // Moving the slider while muted unmutes, so the new volume is actually heard.
  if (S.p?.mute) {
    S.p.mute = false
    volUnmute = true
    paintMute()
  }
  clearTimeout(volTimer)
  clearTimeout(volRelease)
  volTimer = setTimeout(async () => {
    if (volUnmute) {
      volUnmute = false
      await command('mute', { on: false })
    }
    command('volume', { volume: v })
  }, 120)
  // Follow AIMP's volume again once the person stops moving the slider.
  volRelease = setTimeout(() => (S.volBusy = false), 1500)
})

const bar = $('seek')
const frac = (x) => {
  const r = bar.getBoundingClientRect()
  return Math.min(1, Math.max(0, (x - r.left) / r.width))
}
bar.addEventListener('pointerdown', (e) => {
  const { dur } = position()
  if (!dur) return
  S.seeking = true
  $('prog').classList.add('drag')
  bar.setPointerCapture(e.pointerId)
  const draw = (x) => {
    const f = frac(x)
    $('fill').style.width = f * 100 + '%'
    $('knob').style.left = f * 100 + '%'
    $('pos').textContent = fmt(f * dur)
  }
  draw(e.clientX)
  const move = (ev) => draw(ev.clientX)
  const finish = () => {
    bar.removeEventListener('pointermove', move)
    bar.removeEventListener('pointerup', up)
    bar.removeEventListener('pointercancel', finish)
    bar.removeEventListener('lostpointercapture', finish)
    $('prog').classList.remove('drag')
    S.seeking = false
  }
  const up = (ev) => {
    const ms = Math.round(frac(ev.clientX) * dur)
    finish()
    if (S.p) {
      S.p.positionMs = ms
      S.at = performance.now()
    }
    command('seek', { positionMs: ms })
  }
  bar.addEventListener('pointermove', move)
  bar.addEventListener('pointerup', up)
  bar.addEventListener('pointercancel', finish)
  bar.addEventListener('lostpointercapture', finish)
})
bar.addEventListener('keydown', (e) => {
  const { pos, dur } = position()
  if (!dur || (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft')) return
  e.preventDefault()
  const ms = Math.max(0, Math.min(dur - 1000, pos + (e.key === 'ArrowRight' ? 10000 : -10000)))
  // Move the bar now, so quick presses add up instead of all starting from the last poll.
  S.p.positionMs = ms
  S.at = performance.now()
  command('seek', { positionMs: ms })
})
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !(e.target instanceof HTMLInputElement) && !(e.target instanceof HTMLButtonElement) && S.p?.running) {
    e.preventDefault()
    command('playPause')
  }
})
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) poll()
})

show('loading')
poll()
setInterval(poll, 1000)
requestAnimationFrame(tick)
</script>
</body>
</html>
