<!doctype html>
<html lang="en" data-boot>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>B-Side</title>
<link rel="stylesheet" href="fonts.css" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="skins.css" />
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M6.75 5.14v13.72a1 1 0 0 0 1.52.85l11.02-6.86a1 1 0 0 0 0-1.7L8.27 4.29A1 1 0 0 0 6.75 5.14Z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4.2" height="15" rx="1.2"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.2"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 6.2v11.6a1 1 0 0 0 1.55.83L15 12.83a1 1 0 0 0 0-1.66L6.55 5.37A1 1 0 0 0 5 6.2Z"/><rect x="16.6" y="5" width="2.6" height="14" rx="1.1"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M19 6.2v11.6a1 1 0 0 1-1.55.83L9 12.83a1 1 0 0 1 0-1.66l8.45-5.8A1 1 0 0 1 19 6.2Z"/><rect x="4.8" y="5" width="2.6" height="14" rx="1.1"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16.5 3.5 20 7l-3.5 3.5V8h-1.7c-1.2 0-2.3.6-3 1.6l-4.4 6.3A5.6 5.6 0 0 1 2.8 18H2v-2h.8c1.2 0 2.3-.6 3-1.6l4.4-6.3A5.6 5.6 0 0 1 14.8 6h1.7V3.5Zm0 10L20 17l-3.5 3.5V18h-1.7a5.6 5.6 0 0 1-4.3-2l1.2-1.7.1.1c.7 1 1.8 1.6 3 1.6h1.7v-2.5ZM2 6h.8c1.8 0 3.4.8 4.4 2.2l-1.2 1.7-.2-.3C5.1 8.6 4 8 2.8 8H2V6Z"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 2.5 20.5 6 17 9.5V7H7a2 2 0 0 0-2 2v3H3V9a4 4 0 0 1 4-4h10V2.5ZM7 21.5 3.5 18 7 14.5V17h10a2 2 0 0 0 2-2v-3h2v3a4 4 0 0 1-4 4H7v2.5Z"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9h3.5L12 5v14l-4.5-4H4V9Zm11.5-1.3a6 6 0 0 1 0 8.6l-1.4-1.4a4 4 0 0 0 0-5.8l1.4-1.4Zm2.8-2.8a10 10 0 0 1 0 14.2l-1.4-1.4a8 8 0 0 0 0-11.4l1.4-1.4Z"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9h3.5L12 5v14l-4.5-4H4V9Zm11.3.1 1.4-1.4 2.3 2.3 2.3-2.3 1.4 1.4-2.3 2.3 2.3 2.3-1.4 1.4-2.3-2.3-2.3 2.3-1.4-1.4 2.3-2.3-2.3-2.3Z"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M12 5a6 6 0 0 1 5.8 4.5A4.5 4.5 0 0 1 17.5 18.5h-11a5 5 0 0 1-.9-9.9A6 6 0 0 1 12 5Zm0 2a4 4 0 0 0-3.9 3.2l-.2.8-.8.1A3 3 0 0 0 6.5 16.5h11a2.5 2.5 0 0 0 .1-5h-.9l-.1-.8A4 4 0 0 0 12 7Z"/></symbol>
  <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M12 18.5a1.8 1.8 0 1 1 0 3.6 1.8 1.8 0 0 1 0-3.6ZM2.3 8.6a14 14 0 0 1 19.4 0l-1.4 1.4a12 12 0 0 0-16.6 0L2.3 8.6Zm3.5 3.6a9 9 0 0 1 12.4 0l-1.4 1.4a7 7 0 0 0-9.6 0l-1.4-1.4Zm3.5 3.5a4 4 0 0 1 5.4 0l-1.4 1.4a2 2 0 0 0-2.6 0l-1.4-1.4Z"/><path d="M3 3l18 18-1.4 1.4L1.6 4.4 3 3Z"/></symbol>
  <symbol id="i-lyrics" viewBox="0 0 24 24"><path d="M3 5h13v2H3V5Zm0 4h13v2H3V9Zm0 4h8v2H3v-2Zm14-2h4v2h-2v5.5a2.5 2.5 0 1 1-2-2.45V11Z"/></symbol>
  <symbol id="i-open" viewBox="0 0 24 24"><path d="M14 3h7v7h-2V6.4l-8.3 8.3-1.4-1.4L17.6 5H14V3ZM5 5h6v2H5v12h12v-6h2v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/></symbol>
  <symbol id="i-disc" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20Zm0 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16Zm0 5a3 3 0 1 1 0 6 3 3 0 0 1 0-6Zm0 2a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z"/></symbol>
  <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 4h2.6v16H4V4Zm4.6 0h2.6v16H8.6V4Zm4.5 1.1 2.5-.7 4.4 15.4-2.5.7-4.4-15.4Z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.96 12.05l4.25 4.24-1.42 1.42-4.24-4.25A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15.4 4.6 16.8 6l-6 6 6 6-1.4 1.4L8 12l7.4-7.4Z"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m8.6 4.6 7.4 7.4-7.4 7.4L7.2 18l6-6-6-6 1.4-1.4Z"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><path d="M5 10a2 2 0 1 1 0 4 2 2 0 0 1 0-4Zm7 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4Zm7 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/></symbol>
  <symbol id="i-sort" viewBox="0 0 24 24"><path d="M3 6h18v2H3V6Zm3 5h12v2H6v-2Zm3 5h6v2H9v-2Z"/></symbol>
  <symbol id="i-playnext" viewBox="0 0 24 24"><path d="M3 5h12v2H3V5Zm0 4h12v2H3V9Zm0 4h7v2H3v-2Zm11-.5 7 4.5-7 4.5v-9Z"/></symbol>
  <symbol id="i-queue" viewBox="0 0 24 24"><path d="M3 5h12v2H3V5Zm0 4h12v2H3V9Zm0 4h8v2H3v-2Zm13-1h2v3h3v2h-3v3h-2v-3h-3v-2h3v-3Z"/></symbol>
  <symbol id="i-album" viewBox="0 0 24 24"><path d="M4 3h16a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Zm1 2v14h14V5H5Zm7 2.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm0 3.5a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z"/></symbol>
  <symbol id="i-artist" viewBox="0 0 24 24"><path d="M12 3a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm0 11c4.4 0 8 2.2 8 5v2H4v-2c0-2.8 3.6-5 8-5Z"/></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 4a1 1 0 0 1 1-1h7.6a1 1 0 0 1 .7.3l8.4 8.4a1 1 0 0 1 0 1.4l-7.6 7.6a1 1 0 0 1-1.4 0L3.3 12.3a1 1 0 0 1-.3-.7V4Zm4.5 1.5a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 3h11v13.5a3.5 3.5 0 1 1-2-3.16V7h-7v11.5A3.5 3.5 0 1 1 9 15.34V3Z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4 6.4 5Z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M12 4a8 8 0 0 1 6.9 4H16v2h6V4h-2v2.3A10 10 0 1 0 22 12h-2a8 8 0 1 1-8-8Z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m9.5 16.2-4.2-4.2-1.4 1.4 5.6 5.6 12-12-1.4-1.4L9.5 16.2Z"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 2.5 22.5 21h-21L12 2.5Zm0 4.1L5 19h14L12 6.6ZM11 10h2v5h-2v-5Zm0 6.5h2v2h-2v-2Z"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 5a1 1 0 0 1 1-1h6l2 2h8a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5Z"/></symbol>
</svg>

<div class="app" id="app">
  <div class="backdrop" id="backdrop"><i></i><i></i></div>
  <div class="shade"></div>

  <header class="top">
    <div class="brand">
      <button class="logo" id="logo" aria-haspopup="menu" aria-expanded="false" aria-controls="skinMenu" data-i18n-label="changeSkin" aria-label="Change skin">
        <!-- CD: the reflective side, its iridescence turning under a fixed glint. -->
        <span class="deck deck-cd" aria-hidden="true"><i class="cd-disc"></i><i class="cd-glint"></i></span>
        <!-- Vinyl: a record on the platter and a tonearm that lifts off when paused. -->
        <svg class="deck deck-vinyl" viewBox="0 0 36 30" aria-hidden="true">
          <circle class="v-platter" cx="14" cy="15" r="13.9"/>
          <g class="v-rec">
            <circle class="v-disc" cx="14" cy="15" r="13"/>
            <circle class="v-groove" cx="14" cy="15" r="11.4"/>
            <circle class="v-groove" cx="14" cy="15" r="9.6"/>
            <circle class="v-groove" cx="14" cy="15" r="7.6"/>
            <circle class="v-label" cx="14" cy="15" r="4.7"/>
            <path class="v-print" d="M11.3 13.5h5.4M12.2 16.4h3.6"/>
            <circle class="v-hole" cx="14" cy="15" r="0.75"/>
          </g>
          <path class="v-sheen" d="M5.2 8.6a11 11 0 0 1 8-4.6l.3 2.2a8.8 8.8 0 0 0-6.4 3.7Z"/>
          <circle class="v-base" cx="31" cy="4.8" r="3"/>
          <g class="v-arm"><g class="v-lift">
            <path class="v-tube" d="M31 4.8 25.4 19.4"/>
            <path class="v-head" d="M25.6 19 22.7 22.4"/>
            <circle class="v-pivot" cx="31" cy="4.8" r="1.3"/>
          </g></g>
        </svg>
        <!-- Cassette: a pixel tape whose reels turn, two frames at a time. -->
        <svg class="deck deck-cassette" viewBox="0 0 20 13" shape-rendering="crispEdges" aria-hidden="true">
          <path class="c-shell" d="M1 0h18v1h1v11h-1v1H1v-1H0V1h1Z"/>
          <rect class="c-label" x="2" y="1" width="16" height="8"/>
          <rect class="c-s1" x="2" y="1" width="16" height="1"/>
          <rect class="c-s2" x="2" y="2" width="16" height="1"/>
          <rect class="c-s3" x="2" y="7" width="16" height="1"/>
          <rect class="c-win" x="4" y="3" width="12" height="4"/>
          <rect class="c-tape" x="8" y="5" width="4" height="1"/>
          <path class="c-hub c-a" d="M6 3h1v1H6ZM5 4h3v1H5ZM6 5h1v1H6ZM13 3h1v1h-1ZM12 4h3v1h-3ZM13 5h1v1h-1Z"/>
          <path class="c-hub c-b" d="M5 3h1v1H5ZM7 3h1v1H7ZM6 4h1v1H6ZM5 5h1v1H5ZM7 5h1v1H7ZM12 3h1v1h-1ZM14 3h1v1h-1ZM13 4h1v1h-1ZM12 5h1v1h-1ZM14 5h1v1h-1Z"/>
          <path class="c-foot" d="M5 9h10v1h1v3H4v-3h1Z"/>
          <path class="c-holes" d="M6 11h1v1H6ZM13 11h1v1h-1Z"/>
          <rect class="c-led" x="17" y="10" width="1" height="1"/>
        </svg>
      </button>
      <span class="word">B<b>-SIDE</b></span>
      <div class="skinmenu" id="skinMenu" role="menu" data-i18n-label="skin" aria-label="Skin" hidden></div>
    </div>
    <div class="right">
      <div class="pill" id="pill" role="status"><i></i><span data-i18n="connecting">Connecting…</span></div>
      <button class="lang" id="langBtn" aria-haspopup="menu" aria-expanded="false"><img id="langFlag" src="flags/gb.svg" alt="" width="20" height="15"></button>
      <div class="langmenu" id="langMenu" role="menu" hidden></div>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="B-Side">
    <button data-tab="now" aria-current="page">
      <svg aria-hidden="true"><use href="#i-disc"/></svg><span data-i18n="tabNow">Playing</span>
    </button>
    <button data-tab="library">
      <svg aria-hidden="true"><use href="#i-library"/></svg><span data-i18n="tabLibrary">Library</span>
    </button>
    <button data-tab="search">
      <svg aria-hidden="true"><use href="#i-search"/></svg><span data-i18n="tabSearch">Search</span>
    </button>
  </nav>

  <section class="np" id="np" data-i18n-label="nowPlaying" aria-label="Now playing">
    <div class="banner" id="offline" hidden>
      <svg><use href="#i-wifi"/></svg>
      <div><b data-i18n="offline">Offline</b><span data-i18n="offlineHint">Streaming from the cloud needs internet.</span></div>
    </div>

    <div class="empty" id="loading">
      <div class="skel" style="width:min(70%,300px);aspect-ratio:1;border-radius:14px"></div>
      <div class="skel" style="width:180px;height:14px;margin-top:18px"></div>
      <div class="skel" style="width:120px;height:11px;margin-top:8px"></div>
    </div>

    <div class="empty" id="closed" hidden>
      <div class="disc" aria-hidden="true"></div>
      <h2 data-i18n="closedTitle">AIMP is closed</h2>
      <p data-i18n="closedText">Open it to play your collection. B-Side controls it from here.</p>
      <button class="btn" id="openAimp"><svg><use href="#i-open"/></svg><span data-i18n="openAimp">Open AIMP</span></button>
    </div>

    <div class="body" id="player" hidden>
      <div class="np-top">
        <div class="stage" id="stage">
          <div class="cover" id="cover"><div class="disc" id="disc" aria-hidden="true"></div><div class="artistfill" id="artistFill" aria-hidden="true"></div></div>
        </div>
        <div class="meta">
          <div class="title" id="title" data-i18n="nothing">Nothing playing</div>
          <button class="lyrbtn" id="lyricsBtn" data-i18n-label="lyrics" aria-label="Lyrics" aria-pressed="false" hidden><svg aria-hidden="true"><use href="#i-lyrics"/></svg><span data-i18n="lyrics">Lyrics</span></button>
          <div class="subrow"><img class="avatar" id="avatar" alt="" hidden><div class="sub" id="sub"></div></div>
          <div class="tech" id="chips"></div>
        </div>
      </div>
      <div class="lyrbox" id="lyricsBox" hidden>
        <div class="lyrics" id="lyrics" role="region" data-i18n-label="lyrics" aria-label="Lyrics" tabindex="0"></div>
        <div class="lyrsize" role="group" data-i18n-label="lyricsSize" aria-label="Lyrics size">
          <button class="ls-btn" id="lyrSmaller" data-i18n-label="lyricsSmaller" aria-label="Smaller lyrics"><span aria-hidden="true">A−</span></button>
          <button class="ls-btn big" id="lyrLarger" data-i18n-label="lyricsLarger" aria-label="Larger lyrics"><span aria-hidden="true">A+</span></button>
        </div>
      </div>
      <div class="prog" id="prog">
        <div class="track" id="seek" role="slider" data-i18n-label="position" aria-label="Position" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
        <div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>
      </div>
      <div class="transport">
        <button class="ib side" id="shuffle" data-i18n-label="shuffle" aria-label="Shuffle" aria-pressed="false"><svg><use href="#i-shuffle"/></svg></button>
        <button class="ib" id="prev" data-i18n-label="previous" aria-label="Previous"><svg><use href="#i-prev"/></svg></button>
        <button class="ib big" id="play" aria-label="Play"><svg><use href="#i-play"/></svg></button>
        <button class="ib" id="next" data-i18n-label="next" aria-label="Next"><svg><use href="#i-next"/></svg></button>
        <button class="ib side" id="repeat" data-i18n-label="repeat" aria-label="Repeat" aria-pressed="false"><svg><use href="#i-repeat"/></svg></button>
      </div>
      <div class="vol" id="volBox"><button class="ib" id="mute" data-i18n-label="mute" aria-label="Mute" aria-pressed="false"><svg id="volIcon" aria-hidden="true"><use href="#i-vol"/></svg></button><input type="range" id="vol" min="0" max="100" step="1" value="50" data-i18n-label="volume" aria-label="Volume" /><output id="volOut">50</output></div>
      <div class="hint" id="hint" hidden>
        <p data-i18n-html="hint">Pick an album in the <b>Library</b> and play it from here.</p>
        <button class="btn ghost" id="hintLibrary"><svg><use href="#i-library"/></svg><span data-i18n="openLibrary">Browse the library</span></button>
      </div>
    </div>
  </section>

  <section class="view" id="lib" data-i18n-label="tabLibrary" aria-label="Library" hidden></section>
  <section class="view" id="srch" data-i18n-label="tabSearch" aria-label="Search" hidden></section>

  <div class="mini" id="mini" hidden>
    <div class="mini-bar" aria-hidden="true"><i id="miniFill"></i></div>
    <button class="mini-open" id="miniOpen"><span class="art mini-art" id="miniArt"><span class="ph" aria-hidden="true"></span></span><span class="mini-text"><b id="miniTitle"></b><span id="miniSub"></span></span></button>
    <button class="ib" id="miniPlay" aria-label="Play"><svg><use href="#i-play"/></svg></button>
    <button class="ib" id="miniNext" data-i18n-label="next" aria-label="Next"><svg><use href="#i-next"/></svg></button>
  </div>
</div>
<div class="menu" id="menu" role="menu" hidden></div>
<div class="toast" id="toast" role="alert"></div>

<script src="palette.js"></script>
<script src="skins.js"></script>
<script src="i18n.js"></script>
<script src="core.js"></script>
<script src="views/now.js"></script>
<script src="views/library.js"></script>
<script src="views/onedrive.js"></script>
<script src="views/search.js"></script>
<script src="app.js"></script>
</body>
</html>
